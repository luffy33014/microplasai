<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microplastic Detection AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        
        <!-- Water Waves -->
        <div class="water-waves">
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
                </defs>
                <g class="parallax">
                    <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(59, 130, 246, 0.15)" />
                    <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(16, 185, 129, 0.1)" />
                    <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(59, 130, 246, 0.05)" />
                    <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(6, 182, 212, 0.02)" />
                </g>
            </svg>
        </div>
        
        <!-- Interactive Water Bubbles -->
        <div class="bubbles">
            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        </div>
    </div>
    <div class="app-container">
        <header class="main-header">
            <div class="logo">
                <i class="fa-solid fa-water"></i>
                <span>MicroPlastAI</span>
            </div>
            <nav>
                <a href="{{ url_for('index') }}"
                    class="{{ 'active' if request.endpoint in ['index', 'analyze'] else '' }}">Analyze</a>
                <a href="{{ url_for('about') }}" class="{{ 'active' if request.endpoint == 'about' else '' }}">About</a>
                <a href="#">Github</a>
            </nav>
        </header>

        <main class="content-wrapper">
            {% block content %}{% endblock %}
        </main>

        <footer class="main-footer">
            <p>&copy; 2026 AI Microplastic Detection System. Powered by YOLOv11 & OpenCV.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
